# admin/config.yml
backend:
  name: git-gateway
  branch: main
  # Diese URLs sind entscheidend für den Betrieb auf GitHub Pages
  identity_url: https://thorrfalken.netlify.app/.netlify/identity
  gateway_url: https://thorrfalken.netlify.app/.netlify/git

# Erzwingt die Nutzung des Live-Backends
local_backend: false

# Ermöglicht das Speichern von Entwürfen (Review-Prozess)
publish_mode: editorial_workflow

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://thorrfalken.de
locale: de

collections:
  # ─────────────────────────────────────────
  # PROJEKTE (Blog-Posts)
  # ─────────────────────────────────────────
  - name: "projekte"
    label: "Projekte & Aktionen"
    label_singular: "Projekt"
    folder: "src/projekte"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titel", name: "title", widget: "string", required: true }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: true }
      - label: "Titelbild (optional)"
        name: "bild"
        widget: "image"
        required: false
        default: ""
        hint: "Erscheint als Headerbild im Projekt."
      - label: "Teaser"
        name: "teaser"
        widget: "string"
        required: false
        hint: "Kurztext für die Übersichtskarten."
      - { label: "Inhalt", name: "body", widget: "markdown" }

  # ─────────────────────────────────────────
  # VORSTAND & DOWNLOADS & SPONSOREN
  # ─────────────────────────────────────────
  # (Hier bleiben deine Datei-Collections wie oben definiert bestehen)